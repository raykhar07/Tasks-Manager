server {
  listen 80;
  server_name _;

  # No revelar la versión de nginx en las respuestas de error.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad. Van a nivel de servidor para que las hereden
  # TODOS los location: si un location define su propio add_header, nginx
  # deja de heredar las del padre (por eso abajo no se usa add_header).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # El sha256 corresponde al <script> inline de tema en index.html
  # (script-src sin 'unsafe-inline'); si se cambia ese script, hay que
  # recalcular el hash. connect-src permite hablar con la API (ajústalo a tu
  # dominio de API para restringirlo más).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-pXSz4KdWmGcVgXMa+EDMzJKkvT7sxbm3eAK/P3nRWf8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets con hash en el nombre: caché larga. Se usa "expires" (no
  # add_header) para no romper la herencia de las cabeceras de seguridad.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
  }
}
